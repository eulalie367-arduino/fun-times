deployment:
  environment: production
  strategy: blue-green  # Zero-downtime rolling update
  canary:
    enabled: true
    percentage: 5  # 5% of traffic
    duration_hours: 48
    monitoring_interval_seconds: 30

  rolling:
    enabled: true
    percentage: 25  # 25% of instances at a time
    duration_hours: 48
    max_surge_percentage: 20
    max_unavailable_percentage: 10
    drain_timeout_seconds: 60

  instance_health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 5
    unhealthy_threshold: 3
    healthy_threshold: 2

modules:
  memory_profiler:
    enabled: true
    sampling_interval_ms: 100
    attribute_level: component

  quantizer:
    enabled: true
    bit_depth: 8  # uint8 quantization
    calibration_samples: 10000
    calibration_method: percentile

  cache_optimizer:
    enabled: true
    max_size_bytes: 1073741824  # 1 GB (target <1.4 GB total)
    ttl_minutes: 30
    eviction_policy: smart-lru
    scoring_weights:
      recency: 0.4
      frequency: 0.4
      size_penalty: 0.2

  batch_processor:
    enabled: true
    worker_threads: 4
    batch_size: 100
    queue_timeout_seconds: 30

  index_compressor:
    enabled: true
    compression_level: 6  # zlib compression
    delta_encoding: true
    adaptive_compression: true

monitoring:
  metrics:
    - name: memory_usage_mb
      threshold: 1500  # 1.5 GB
      alert_on: exceed

    - name: latency_p95_ms
      threshold: 900
      alert_on: exceed

    - name: cache_hit_rate
      threshold: 0.75
      alert_on: below

    - name: quantization_error
      threshold: 0.01
      alert_on: exceed

    - name: error_rate
      threshold: 0.001  # 0.1%
      alert_on: exceed

  dashboard:
    update_interval_seconds: 5
    retention_days: 30

  alerts:
    slack:
      enabled: true
      webhook_env: SLACK_WEBHOOK_DEPLOY
      channels:
        - alerts

    email:
      enabled: true
      recipients:
        - devops@company.com
        - platform@company.com

rollback:
  enabled: true
  automatic_on_health_check_failure: true
  max_consecutive_failures: 3
  snapshot_retention_days: 7

  procedure:
    - name: drain_connections
      timeout_seconds: 60
    - name: restore_previous_version
      skip_on_manual: false
    - name: run_health_checks
      wait_seconds: 30
    - name: notify_team
      method: slack_and_email

performance_baselines:
  memory_baseline_mb: 2100
  memory_target_mb: 1400
  memory_reduction_target_percent: 33

  latency_baseline_p95_ms: 850
  latency_target_p95_ms: 900

  cache_hit_rate_baseline: 0.60
  cache_hit_rate_target: 0.75

post_deployment:
  validate_metrics: true
  burn_in_period_hours: 24
  gradual_traffic_increase:
    - step: 0%
      wait_hours: 0
    - step: 25%
      wait_hours: 6
    - step: 50%
      wait_hours: 12
    - step: 75%
      wait_hours: 18
    - step: 100%
      wait_hours: 24
