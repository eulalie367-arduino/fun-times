# Hybrid Search Configuration
#
# This configuration file defines all parameters for the hybrid search layer,
# combining sparse (BM25) and dense (vector) retrieval with RRF fusion
# and cross-encoder reranking.

# Reciprocal Rank Fusion (RRF) Configuration
rrf:
  # RRF parameter k controls fusion strength
  # Lower k = stronger contribution from high-ranked results
  # Higher k = more even weighting
  # Default: 60 (recommended for most use cases)
  k: 60

  # RRF alpha controls weighting between BM25 and dense retrieval
  # 0.0 = Dense only, 1.0 = BM25 only
  # 0.5 = Equal weight (recommended)
  # 0.7 = Favor BM25 (good for domain-specific queries)
  # 0.3 = Favor dense (good for semantic queries)
  alpha: 0.5

# Semantic Query Cache Configuration
semantic_cache:
  # Maximum number of queries to cache
  # Larger = more memory but better hit rate
  # Typical: 1000-5000
  max_size: 1000

  # Time-to-live in seconds (default: 24 hours)
  # Longer = more stale results possible
  # Shorter = more cache misses
  ttl_seconds: 86400

  # Cosine similarity threshold for cache hit
  # Higher = stricter matching (60-70% hit rate)
  # Lower = looser matching (80-95% hit rate)
  # Default: 0.95 (recommended)
  similarity_threshold: 0.95

# BM25 Indexer Configuration
bm25:
  # Number of results to retrieve from BM25 before fusion
  # Larger = better recall but slower
  # Typical: 20-30
  top_k: 20

# Dense Retrieval Configuration (ChromaDB)
dense:
  # Number of results to retrieve from dense search before fusion
  # Should match BM25 top_k for balanced fusion
  top_k: 20

# Fusion Configuration
fusion:
  # Number of top documents to keep before reranking
  # Larger = better quality but slower
  # Typical: 15-30 (depends on reranking availability)
  top_k: 20

# Cross-Encoder Reranking Configuration
reranker:
  # Enable/disable cross-encoder reranking
  enabled: true

  # Model name from HuggingFace
  # BAAI/bge-reranker-v2-m3 = best multilingual performance
  # BAAI/bge-reranker-base = faster, smaller model
  model_name: "BAAI/bge-reranker-v2-m3"

  # Batch size for reranking inference
  # Larger = faster but more memory
  # Typical: 32 for most GPUs
  batch_size: 32

  # Device to use for inference
  # "auto" = auto-detect GPU, fallback to CPU
  # "cuda" = GPU only
  # "cpu" = CPU only
  device: "auto"

  # Number of results after reranking
  # Typical: 10 (return top 10 after reranking)
  top_k: 10

# Search Pipeline Configuration
search:
  # Enable semantic cache for speedup
  # Set false to disable (useful for testing)
  use_cache: true

  # Enable cross-encoder reranking
  # Set false for speed (accuracy: 88% vs 94%)
  use_reranking: true

  # Default number of results to return
  # Can override per-query
  default_top_k: 10

  # Timeout in seconds for search operation
  # Includes all steps: cache check, retrieval, fusion, reranking
  timeout_seconds: 30

# Performance Targets
performance:
  # Target cache hit rate
  # Typical: 60-80%
  # If lower, try:
  # - Increase max_size in semantic_cache
  # - Lower similarity_threshold
  cache_hit_rate_target: 0.70

  # Target latency for cached queries (milliseconds)
  cache_latency_target_ms: 500

  # Target latency for cold queries (milliseconds)
  cold_latency_target_ms: 2000

  # Target accuracy improvement over vector-only
  # Typical: 15-30%
  accuracy_improvement_target: 0.20

# Logging Configuration
logging:
  # Log level for retrieval operations
  # DEBUG = very verbose
  # INFO = normal
  # WARNING = errors only
  level: "INFO"

  # Log cache statistics every N queries
  cache_stats_interval: 100

  # Log detailed timing information
  detailed_timing: false

# Advanced Configuration

# RRF Parameter Tuning by Use Case
# Uncomment the section that matches your use case

# Technical Documentation (favor keywords)
# rrf:
#   k: 60
#   alpha: 0.7  # 70% BM25, 30% dense

# General Knowledge Base (balanced)
# rrf:
#   k: 60
#   alpha: 0.5  # 50/50

# Narrative Text / Creative Content (favor semantics)
# rrf:
#   k: 60
#   alpha: 0.3  # 30% BM25, 70% dense

# Cache Tuning by Application
# Uncomment the section that matches your needs

# Low Cache Hit Rate Tolerance (fast response)
# semantic_cache:
#   max_size: 5000
#   ttl_seconds: 86400
#   similarity_threshold: 0.85  # More aggressive matching

# High Quality Focus (accuracy over speed)
# semantic_cache:
#   max_size: 1000
#   ttl_seconds: 3600
#   similarity_threshold: 0.98  # Strict matching

# Memory-Constrained Environment
# semantic_cache:
#   max_size: 100
#   ttl_seconds: 1800
#   similarity_threshold: 0.90
#
# fusion:
#   top_k: 10
#
# reranker:
#   batch_size: 8
#   enabled: false  # Disable reranking

---
# YAML Schema (for validation)
#
# rrf:
#   k: integer (> 0)
#   alpha: float (0.0 - 1.0)
#
# semantic_cache:
#   max_size: integer (> 0)
#   ttl_seconds: integer (> 0)
#   similarity_threshold: float (0.0 - 1.0)
#
# bm25:
#   top_k: integer (> 0)
#
# dense:
#   top_k: integer (> 0)
#
# fusion:
#   top_k: integer (> 0)
#
# reranker:
#   enabled: boolean
#   model_name: string
#   batch_size: integer (> 0)
#   device: string ("auto" | "cuda" | "cpu")
#   top_k: integer (> 0)
#
# search:
#   use_cache: boolean
#   use_reranking: boolean
#   default_top_k: integer (> 0)
#   timeout_seconds: integer (> 0)
